appId: org.feynmind.app
productName: FeynMind
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # PDF.js: only the Node ("legacy") build and its data are used. The Liberation fonts are
  # GPL-2.0 (with a font exception) and are left out; see docs/tech-plan.md, Known limitations.
  - '!node_modules/pdfjs-dist/{build,web,image_decoders,types}/**'
  - '!node_modules/pdfjs-dist/standard_fonts/{LiberationSans-*,LICENSE_LIBERATION}'
extraResources:
  - from: prompts
    to: prompts
# Native libraries, WASM files and worker scripts must live outside app.asar. Tesseract's worker
# thread loads its dependencies from the unpacked folder, so they are unpacked with it.
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/sqlite-vec*/**
  - node_modules/@napi-rs/canvas*/**
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/eng/**
  - node_modules/{bmp-js,idb-keyval,is-url,node-fetch,whatwg-url,tr46,webidl-conversions,opencollective-postinstall,regenerator-runtime,wasm-feature-detect,zlibjs}/**
win:
  # onnxruntime-node ships binaries for every platform; keep only this one's.
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**'
  target: nsis
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/{win32,linux}/**'
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.education
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Unsigned for now; see docs/tech-plan.md, Risks.
  identity: null
linux:
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/{win32,darwin}/**'
  target: AppImage
  category: Education
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
publish:
  provider: github
  releaseType: draft
