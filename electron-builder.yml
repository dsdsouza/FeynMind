appId: org.feynmind.app
productName: FeynMind
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
  # PDF.js: only the Node ("legacy") build and its data are used. The Liberation fonts are
  # GPL-2.0 (with a font exception) and are left out; see docs/tech-plan.md, Known limitations.
  - '!node_modules/pdfjs-dist/{build,web,image_decoders,types}/**'
  - '!node_modules/pdfjs-dist/standard_fonts/{LiberationSans-*,LICENSE_LIBERATION}'
  # onnxruntime-node ships binaries for every platform and architecture; keep only this build's.
  # (Platform-level `files` lists cannot be used for this: one with only exclusions packs everything.)
  - '!node_modules/onnxruntime-node/bin/napi-v6/!(${platform})/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/${platform}/!(${arch})/**'
extraResources:
  - from: prompts
    to: prompts
  # The clip "Check speed on this computer" transcribes (LibriSpeech, CC BY 4.0), with its attribution.
  - from: tests/fixtures/audio/speech-29s.wav
    to: speech-check/speech-29s.wav
  - from: assets/speech-check/ATTRIBUTION.txt
    to: speech-check/ATTRIBUTION.txt
# Native libraries, WASM files and worker scripts must live outside app.asar. Tesseract's worker
# thread loads its dependencies from the unpacked folder, so they are unpacked with it.
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/sqlite-vec*/**
  - node_modules/@napi-rs/canvas*/**
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/eng/**
  - node_modules/{bmp-js,idb-keyval,is-url,node-fetch,whatwg-url,tr46,webidl-conversions,opencollective-postinstall,regenerator-runtime,wasm-feature-detect,zlibjs}/**
win:
  target: nsis
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      # Apple silicon only; Intel Macs are not supported (see docs/tech-plan.md, Known limitations).
      arch: [arm64]
  category: public.app-category.education
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # Unsigned for now; see docs/tech-plan.md, Risks.
  identity: null
  # Required before macOS lets the app use the microphone (without it, the app is stopped).
  extendInfo:
    NSMicrophoneUsageDescription: FeynMind turns what you say into text on this computer, so you can explain your thinking out loud. Audio is never stored or sent anywhere.
linux:
  target: AppImage
  category: Education
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
publish:
  provider: github
  releaseType: draft
