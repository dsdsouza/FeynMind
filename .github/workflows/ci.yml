name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # postinstall rebuilds better-sqlite3 for Electron; unit tests run inside Electron's Node.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
