name: Release

# On a version tag (e.g. v0.0.2): build unsigned installers for Windows, macOS and Linux,
# smoke-test each packaged app, and only if all three pass, upload them to a draft GitHub Release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm ci

      # Fails if a runtime dependency is only a peer dependency (electron-builder would drop it).
      - run: npm run check:deps

      - name: Build installers (not published yet)
        run: npm run dist
        env:
          # No signing certificates yet (see docs/tech-plan.md, Risks).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Launches the packaged app from outside the checkout and fails if it cannot start.
      - name: Smoke test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum npm run smoke
      - name: Smoke test the packaged app
        if: runner.os != 'Linux'
        run: npm run smoke

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.AppImage
            release/*/*.blockmap
            release/*/latest*.yml

  publish:
    name: Upload to draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s globstar nullglob
          files=(dist/**/*.exe dist/**/*.dmg dist/**/*.AppImage dist/**/*.blockmap dist/**/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then echo "No installers found" >&2; exit 1; fi
          printf 'Uploading %s\n' "${files[@]}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --verify-tag \
              --title "FeynMind $GITHUB_REF_NAME" --notes "Unsigned test build."
          fi
